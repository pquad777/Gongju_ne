<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공주네</title>
<meta name="theme-color" content="#FAF6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공주네">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one-screen phone app — small header, scrolling view, fixed Instagram-style bottom tab bar (4 tabs) */
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --ink:#3E3236; --muted:#8C7F84; --line:#EDE4DF;
  --accent:#8F78DA; --accent-soft:#EFEAFB; --gold:#EDB842; --gold-soft:#FCF2D6;
  --me:#5FA8E3; --me-soft:#E4F1FB; --her:#F28F7A; --her-soft:#FDECE8;
  --shadow:0 6px 20px rgba(80,60,70,.08);
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1A22; --surface:#29242E; --ink:#F3ECEF; --muted:#A79DA5; --line:#3A3340;
  --accent:#B3A0F0; --accent-soft:#332C44; --gold:#F2C95E; --gold-soft:#3D3424;
  --me:#7DBDEC; --me-soft:#22344A; --her:#F5A593; --her-soft:#45302D;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1A22; --surface:#29242E; --ink:#F3ECEF; --muted:#A79DA5; --line:#3A3340;
  --accent:#B3A0F0; --accent-soft:#332C44; --gold:#F2C95E; --gold-soft:#3D3424;
  --me:#7DBDEC; --me-soft:#22344A; --her:#F5A593; --her-soft:#45302D;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
img,svg{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}

#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.top{padding-top:calc(14px + env(safe-area-inset-top,0px))!important;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{margin:0;font-size:24px}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.who{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:13px}
.who svg{display:block}
#view{flex:1;overflow-y:auto;padding:4px 16px 104px;-webkit-overflow-scrolling:touch}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.section-title h2{margin:0;font-size:19px}
.section-title span{font-size:12px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{color:var(--accent);transform:translateY(-1px)}
.tab .ic{transition:transform .2s}

/* shared bits */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-hj{background:var(--me)} .d-gy{background:var(--her)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;flex:none}
.t-hj{background:var(--me-soft);color:var(--ink)} .t-gy{background:var(--her-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:16px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink);min-width:0}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.cal-head h2{margin:0;font-size:22px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk{font-size:12px;color:var(--muted);padding-bottom:6px}
.wk:first-child{color:var(--her)} .wk:last-child{color:var(--me)}
.day{aspect-ratio:1/1.05;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px;border-radius:14px;font-variant-numeric:tabular-nums}
.day .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px}
.day.sun .n{color:var(--her)} .day.sat .n{color:var(--me)}
.day.today .n{background:var(--gold-soft);color:var(--ink);font-weight:700}
.day.sel{background:var(--accent-soft)}
.day.sel .n{background:var(--accent);color:#fff}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots .dot{width:6px;height:6px}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.ev .tm{font-size:13px;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
.ev .tt{flex:1;min-width:0;overflow-wrap:anywhere}

/* bucket */
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.add-row .btn{padding:12px 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;margin:14px 0 12px;box-shadow:var(--shadow)}
.seg button{padding:9px;border-radius:11px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:15px}
.bk{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px;background:var(--surface);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.bk .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.bk.done .chk{background:var(--gold);border-color:var(--gold);color:#fff}
.bk .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.bk.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
.bk .meta{font-size:11px;color:var(--muted);display:block;text-decoration:none}

/* d-day */
.hero{position:relative;overflow:hidden;text-align:center;padding:22px 16px 18px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:56px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .big em{font-style:normal;color:var(--accent)}
.hero .pair{display:flex;justify-content:center;align-items:center;gap:4px;margin-bottom:6px}
.hero .since{font-size:13px;color:var(--muted)}
.prog{margin-top:16px;text-align:left}
.prog .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.an{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.an .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.an .ic.cu{background:var(--accent-soft);color:var(--accent)}
.an .b{flex:1;min-width:0}
.an .b b{display:block;font-weight:400;font-family:var(--f-display);font-size:15px}
.an .b span{font-size:12px;color:var(--muted)}
.an .dd{font-family:var(--f-display);font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.an .dd.zero{color:var(--her)}

/* plus */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font-size:13px;text-align:center}
.app .ai{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.app.soon{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--muted)}
.app.soon .ai{background:transparent;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;margin:4px 0 6px}

/* slot machine */
.machine{position:relative;margin:10px auto 0;max-width:340px;border-radius:28px;padding:18px 18px 20px;background:var(--accent);box-shadow:var(--shadow)}
.machine .crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%)}
.marquee{text-align:center;color:#fff;font-family:var(--f-display);font-size:18px;margin:6px 0 10px;letter-spacing:.06em}
.lights{position:absolute;inset:7px;border-radius:22px;pointer-events:none}
.lights i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.45}
.machine.spinning .lights i{animation:blink .5s infinite alternate}
.machine.spinning .lights i:nth-child(odd){animation-delay:.25s}
.machine.win .lights i{opacity:1;animation:none}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.window{height:72px;border-radius:16px;background:var(--surface);overflow:hidden;position:relative;box-shadow:inset 0 3px 10px rgba(0,0,0,.12)}
.window::before,.window::after{content:"";position:absolute;left:0;right:0;height:18px;z-index:2;pointer-events:none}
.window::before{top:0;background:linear-gradient(var(--surface),transparent)}
.window::after{bottom:0;background:linear-gradient(transparent,var(--surface))}
.strip{will-change:transform}
.strip div{height:72px;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.lever{display:block;margin:14px auto 0;width:100%;padding:13px;border-radius:16px;background:var(--gold);color:#3E3236;font-family:var(--f-display);font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lever:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.lever:disabled{opacity:.6}
.result{text-align:center;margin:14px 0 2px;min-height:24px;font-size:14px;color:var(--muted)}
.result b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:17px}
.mn{display:flex;flex-wrap:wrap;gap:8px}
.mn .m{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:99px;font-size:14px}
.mn .m button{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}

/* slow eating timer */
.slow{text-align:center;padding:20px 16px 18px}
.ring{position:relative;width:min(240px,100%);aspect-ratio:1;max-width:100%;margin:0 auto 16px}
.ring > svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rin svg{flex:none}
.chip.cu{display:inline-flex;align-items:center;gap:4px;padding-right:6px}
.chip.cu .cx{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;opacity:.7}
.chip.add{width:34px;padding:6px 0;text-align:center;font-family:var(--f-display);font-size:16px;line-height:1.2}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:18px}
.stepper input{text-align:center;font-family:var(--f-display);font-size:22px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.ring .rbg{fill:none;stroke:var(--her-soft);stroke-width:12}
.ring .rfg{fill:none;stroke:var(--her);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .3s}
.slow.ready .rfg{stroke:var(--gold)}
.ring .rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .big{font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .sub{font-size:13px;color:var(--muted)}
.bite{background:var(--her)}
.slow.ready .bite{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.bite:disabled{background:var(--her-soft);color:var(--muted);animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}

/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,20,30,.35)}
.panel{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.panel .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.panel h3{margin:0 0 14px;font-size:20px}
.panel form{display:flex;flex-direction:column;gap:12px}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{color:var(--gold);font-family:var(--f-display)}

/* login */
.login{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-inline:16px}
.login-in{max-width:400px;margin:0 auto;padding-block:48px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.login h1{font-size:40px;margin:8px 0 0}
.login p{margin:0;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:26px 0 18px}
.pick button{padding:16px 8px 12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-display);font-size:18px}
.pick button[aria-pressed="true"]{border-color:var(--accent)}
.login form{width:100%;display:flex;flex-direction:column;gap:10px}
.login .err{color:var(--her);font-size:13px;min-height:20px}
.demo{font-size:12px;color:var(--muted);background:var(--gold-soft);padding:6px 12px;border-radius:99px;margin-top:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25 L3 9 L11 15 L16 5 L21 15 L29 9 L27 25 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.2" fill="var(--her)"/></svg>
      <div><h1 class="disp">공주네</h1><small id="modeNote"></small></div>
    </div>
    <button class="who" id="whoBtn" aria-label="사용자 바꾸기"></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="메인 메뉴"><div class="tabs-in" id="tabs"></div></nav>
</div>
<div id="layer"><section class="login"><div class="login-in"><h1 class="disp" style="font-size:28px;margin-top:40vh">공주네</h1><p>불러오는 중…</p></div></section></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
